name: Flutter Web Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze

      - name: Construire l'application Web
        run: flutter build web --release --base-href /fcssm/

      - name: Copier la politique de confidentialité
        run: cp privacy-policy.html build/web/privacy-policy.html

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artifact GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
